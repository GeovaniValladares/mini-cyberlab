<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background terminal -->
  <rect width="400" height="300" rx="12" fill="#0d1221"/>
  <rect width="400" height="32" rx="12" fill="#1a2040"/>
  <rect width="400" height="20" y="12" fill="#1a2040"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="6" fill="#28ca41"/>
  <!-- Terminal title -->
  <text x="200" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#888b96">ULS CyberLab Terminal</text>
  
  <!-- Prompt lines -->
  <text x="20" y="65" font-family="monospace" font-size="11" fill="#00ff88">root@uls-cyberlab:~$</text>
  <text x="178" y="65" font-family="monospace" font-size="11" fill="#e0e0e0"> whoami</text>
  
  <text x="20" y="85" font-family="monospace" font-size="11" fill="#888b96">ethical_hacker</text>
  
  <text x="20" y="110" font-family="monospace" font-size="11" fill="#00ff88">root@uls-cyberlab:~$</text>
  <text x="178" y="110" font-family="monospace" font-size="11" fill="#e0e0e0"> cat flags.txt</text>
  
  <text x="20" y="130" font-family="monospace" font-size="10" fill="#00cc66">FLAG{SQL_1NJ3CT10N_M4ST3R}</text>
  <text x="20" y="148" font-family="monospace" font-size="10" fill="#00cc66">FLAG{XSS_R3FL3CT3D}</text>
  <text x="20" y="166" font-family="monospace" font-size="10" fill="#00cc66">FLAG{W3BSH3LL_UPL04D3D}</text>
  <text x="20" y="184" font-family="monospace" font-size="10" fill="#00cc66">FLAG{BRUT3_F0RC3_K1NG}</text>
  <text x="20" y="202" font-family="monospace" font-size="10" fill="#ffaa00">FLAG{ULS_CYB3RL4B_W1NN3R} ê ???</text>
  
  <text x="20" y="225" font-family="monospace" font-size="11" fill="#00ff88">root@uls-cyberlab:~$</text>
  <!-- Blinking cursor -->
  <rect x="178" y="213" width="8" height="14" fill="#00ff88" opacity="0.8"/>
  
  <!-- Shield icon on the right -->
  <path d="M320 80 L360 95 L360 145 C360 165 340 180 320 190 C300 180 280 165 280 145 L280 95 Z" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <path d="M310 135 L318 143 L335 123" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- ULS Badge -->
  <rect x="260" y="220" width="120" height="50" rx="8" fill="#001a0d" stroke="#00cc66" stroke-width="1"/>
  <text x="320" y="242" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88">ULS CyberLab</text>
  <text x="320" y="258" text-anchor="middle" font-family="monospace" font-size="8" fill="#888b96">FESOL 2026</text>
